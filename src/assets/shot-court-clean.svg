<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1338 1176" role="img" aria-label="Pista y portería de balonmano sin textos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171c20"/>
      <stop offset="1" stop-color="#0f1316"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b8a69"/>
      <stop offset="1" stop-color="#2f6f55"/>
